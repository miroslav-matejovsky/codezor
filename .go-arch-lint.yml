version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"
  - "test"
  - "vendor"
  - ".tmp"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"
  # Test fixtures are input for tests, not part of any component.
  - "^.*[\\\\/]testdata[\\\\/].*$"

# Third-party packages that components may use via 'canUse'.
vendors:
  scc: { in: "github.com/boyter/scc/**" }

components:
  main: { in: . }
  analyze: { in: internal/analyze }
  gitrepo: { in: internal/gitrepo }
  markdown: { in: internal/markdown }
  report: { in: internal/report }

deps:
  # main is the composition root: it wires the components together.
  main:
    mayDependOn: [analyze, report]
  # analyze owns the only contact with scc, and reads the repository through
  # gitrepo rather than running git itself.
  analyze:
    mayDependOn: [gitrepo]
    canUse: [scc]
  # gitrepo has no entry on purpose: it talks to git through the standard
  # library and may import no component and no vendor.
  #
  # markdown has no entry on purpose: it lays out tables out of strings and may
  # import no component and no vendor.
  #
  # report renders what analyze produced, through markdown, and reaches nothing
  # else.
  report:
    mayDependOn: [analyze, markdown]
