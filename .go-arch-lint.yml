version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"
  - "test"
  - "vendor"
  - ".tmp"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"
  # Test fixtures are input for tests, not part of any component.
  - "^.*[\\\\/]testdata[\\\\/].*$"

# Third-party packages that components may use via 'canUse'.
vendors:
  scc: { in: "github.com/boyter/scc/**" }

components:
  main: { in: . }
  analyze: { in: internal/analyze }
  report: { in: internal/report }

deps:
  # main is the composition root: it wires the components together.
  main:
    mayDependOn: [analyze, report]
  # analyze owns the only contact with scc.
  analyze:
    canUse: [scc]
  # report renders what analyze produced and reaches nothing else.
  report:
    mayDependOn: [analyze]
